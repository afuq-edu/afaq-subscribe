<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حاضر — مكتبة التحاضير</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { min-height: 100vh; }
  .top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 10px 22px; background: linear-gradient(135deg, var(--brand) 0%, #13867c 60%, #1a9a8e 100%); color: #fff; }
  .top img { width: 36px; height: 36px; border-radius: 10px; background: rgba(255,255,255,.14); padding: 3px; }
  .top h1 { margin: 0; font-size: 19px; font-weight: 800; line-height: 1.1; }
  .top p { margin: 0; font-size: 12px; opacity: .85; }
  .gsearch { margin-inline-start: auto; position: relative; width: min(360px, 42vw); }
  .gsearch .ic { position: absolute; top: 50%; right: 11px; transform: translateY(-50%); opacity: .7; pointer-events: none; }
  .gsearch input { width: 100%; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.14); color: #fff; border-radius: 11px; padding: 8px 36px 8px 12px; outline: none; }
  .gsearch input::placeholder { color: rgba(255,255,255,.75); }
  .gsearch input:focus { background: rgba(255,255,255,.22); border-color: #fff; }

  .wrap { display: grid; grid-template-columns: 220px 1fr; gap: 20px; max-width: 1200px; margin: 0 auto; padding: 18px 22px 70px; align-items: start; }
  .side { position: sticky; top: 74px; display: grid; gap: 2px; }
  .side a { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 11px; color: var(--ink-2); text-decoration: none; font-weight: 700; }
  .side a:hover { background: var(--card); color: var(--ink); }
  .side a.on { background: var(--brand); color: #fff; box-shadow: 0 6px 14px -8px var(--brand); }
  .side a .cnt { margin-inline-start: auto; font-size: 11px; background: var(--bg-2); color: var(--ink-2); border-radius: 999px; padding: 0 7px; }
  .side a.on .cnt { background: rgba(255,255,255,.2); color: #fff; }
  .side .sep { height: 1px; background: var(--line); margin: 8px 8px; }
  .side a.minor { font-weight: 500; font-size: 13px; color: var(--ink-3); }
  .view { min-width: 0; display: grid; gap: 14px; }

  .page-h { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .page-h h2 { margin: 0; font-size: 22px; font-weight: 800; }
  .page-h .sub { margin: 3px 0 0; color: var(--ink-2); }
  .page-h .acts { margin-inline-start: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .crumbs { font-size: 13px; color: var(--ink-3); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .crumbs a { text-decoration: none; font-weight: 700; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; }
  .card h3 { margin: 0 0 10px; font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .n { width: 22px; height: 22px; border-radius: 50%; background: var(--brand); color: #fff; font-size: 12px; font-weight: 800; display: inline-grid; place-items: center; flex: none; }
  .hint { font-size: 12.5px; color: var(--ink-3); line-height: 1.7; }
  label.f { display: grid; gap: 4px; font-size: 12.5px; color: var(--ink-2); font-weight: 700; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

  /* بطاقات المواد */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(275px, 1fr)); gap: 14px; }
  .pcard { display: grid; gap: 10px; text-decoration: none; color: inherit; transition: border-color .15s, transform .12s; cursor: pointer; }
  .pcard:hover { border-color: var(--brand); transform: translateY(-2px); }
  .pc-top { display: flex; gap: 11px; align-items: center; }
  .pc-ico { width: 42px; height: 42px; border-radius: 12px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-weight: 800; font-size: 18px; flex: none; }
  .pc-top b { display: block; font-size: 15.5px; line-height: 1.35; }
  .pc-top small { color: var(--ink-3); font-size: 12px; }
  .pc-meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); }
  .pc-meta .ok { color: var(--ok); font-weight: 700; }
  .pc-meta .fl { color: var(--gold); font-weight: 700; }
  .pc-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .add-card { border: 2px dashed var(--line); background: transparent; box-shadow: none; display: grid; place-items: center; text-align: center; color: var(--ink-3); min-height: 150px; text-decoration: none; }
  .add-card:hover { border-color: var(--brand); color: var(--brand); }
  .banner { border-inline-start: 4px solid var(--gold); }
  .banner ul { margin: 6px 0 0; padding-inline-start: 20px; line-height: 1.9; }

  /* صفحة المادة */
  .ph { display: grid; grid-template-columns: 1fr auto; gap: 18px; }
  .title-in { font-size: 20px; font-weight: 800; border-color: transparent; background: transparent; padding: 3px 8px; margin: -3px -8px 6px; }
  .title-in:hover { border-color: var(--line); }
  .ph-meta { display: grid; grid-template-columns: 1fr 150px 2fr; gap: 10px; }
  .days-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; font-size: 12.5px; color: var(--ink-2); font-weight: 700; }
  .ph-side { display: grid; gap: 8px; align-content: start; min-width: 190px; }
  .big-num { font-size: 26px; font-weight: 800; color: var(--ok); line-height: 1; }
  .big-num small { font-size: 13px; color: var(--ink-3); font-weight: 700; }
  .ph-acts { display: grid; gap: 6px; }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .toolbar .input { max-width: 320px; }
  .grp { padding: 0; overflow: hidden; }
  .grp-h { display: flex; gap: 10px; align-items: center; padding: 12px 16px; background: var(--bg); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .grp-h .gt { min-width: 0; flex: 1 1 260px; }
  .grp-h small { display: block; color: var(--gold); font-weight: 800; font-size: 12px; }
  .grp-h h3 { margin: 0; font-size: 15px; line-height: 1.45; unicode-bidi: plaintext; }
  .grp-p { font-size: 12px; color: var(--ink-2); font-weight: 700; min-width: 110px; display: grid; gap: 4px; }
  .srow { display: grid; grid-template-columns: 26px 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .srow:last-child { border-bottom: 0; }
  .srow .sd { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 11px; font-weight: 800; color: var(--ink-3); }
  .srow.saved .sd { background: var(--ok); border-color: var(--ok); color: #fff; }
  .srow.filled .sd { background: var(--gold-soft); border-color: var(--gold); color: var(--gold); }
  .srow .stt b { display: block; line-height: 1.45; unicode-bidi: plaintext; }
  .srow .stt small { color: var(--ink-3); font-size: 12px; }
  .srow.saved .stt small { color: var(--ok); }
  .srow.filled .stt small { color: var(--gold); }
  .sacts { display: flex; gap: 2px; align-items: center; position: relative; }
  .menu { position: absolute; top: 100%; left: 0; z-index: 10; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 14px 30px -10px rgba(0,0,0,.3); padding: 5px; display: grid; min-width: 190px; }
  .menu button { display: flex; gap: 8px; align-items: center; background: none; border: 0; padding: 8px 10px; border-radius: 8px; cursor: pointer; text-align: right; font-weight: 700; font-size: 13px; color: var(--ink); }
  .menu button:hover { background: var(--bg); }
  .menu button.danger { color: var(--bad); }
  .spv { grid-column: 1 / -1; border-top: 1px dashed var(--line); margin-top: 6px; padding-top: 8px; }

  /* المعاينة الكاملة */
  .fv { display: grid; grid-template-columns: 170px 1fr; gap: 12px; padding: 8px 0; border-top: 1px dashed var(--line); }
  .fv:first-child { border-top: 0; }
  .fv > b { color: var(--brand); font-size: 13px; }
  .fv > div { line-height: 1.8; min-width: 0; overflow-wrap: anywhere; }
  .fv p { margin: 0 0 4px; }
  .fv .chip { margin: 0 0 4px 4px; }
  .fv .empty-v { color: var(--ink-3); font-style: italic; }

  /* المحرر */
  .fld { padding: 14px 0; border-top: 1px solid var(--line); display: grid; gap: 8px; }
  .fld:first-of-type { border-top: 0; }
  .fh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .fh b { font-size: 14.5px; }
  .fh small { color: var(--ink-3); font-size: 12px; }
  .fh .cnt { margin-inline-start: auto; font-size: 12px; font-weight: 800; color: var(--ink-3); }
  .fh .cnt.full { color: var(--ok); }
  .picks { display: flex; flex-wrap: wrap; gap: 6px; }
  .pick { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 12px; font-weight: 700; font-size: 13px; cursor: pointer; color: var(--ink-2); }
  .pick:hover { border-color: var(--brand); }
  .pick.on { background: var(--brand); border-color: var(--brand); color: #fff; }
  .pick.lv.on { background: var(--gold); border-color: var(--gold); }
  .rich-wrap { border: 1px solid var(--line); border-radius: 11px; background: var(--card); overflow: hidden; }
  .rich-wrap:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .rich-tb { display: flex; gap: 2px; padding: 4px 6px; border-bottom: 1px solid var(--line); background: var(--bg); }
  .rich-tb button { border: 0; background: none; border-radius: 7px; min-width: 28px; height: 26px; cursor: pointer; font-weight: 800; color: var(--ink-2); }
  .rich-tb button:hover { background: var(--card); color: var(--brand); }
  .rich { min-height: 70px; max-height: 420px; overflow-y: auto; padding: 9px 12px; outline: none; line-height: 1.8; }
  .rich p { margin: 0 0 4px; }
  .rich:empty::before { content: attr(data-ph); color: var(--ink-3); }
  .savebar { position: sticky; bottom: 0; z-index: 15; display: flex; gap: 8px; align-items: center; padding: 12px 16px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 -8px 24px -14px rgba(0,0,0,.3); flex-wrap: wrap; }
  .savebar .dirty { color: var(--warn); font-weight: 700; font-size: 12.5px; }
  .savebar .sp { margin-inline-start: auto; }

  /* الإضافة */
  .src-tabs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .src-tabs .seg { border: 1.5px solid var(--line); background: var(--card); border-radius: 10px; padding: 6px 14px; font-weight: 700; cursor: pointer; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; }
  .src-tabs .seg.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
  .drop { border: 2px dashed var(--line); border-radius: 14px; padding: 26px; text-align: center; color: var(--ink-2); display: grid; gap: 8px; justify-items: center; }
  .drop.over { border-color: var(--brand); background: var(--brand-soft); }
  .merge-opt { display: grid; gap: 6px; margin: 4px 0 10px; padding: 10px 12px; border: 1.5px solid var(--brand); border-radius: 12px; background: var(--brand-soft); font-size: 13px; }
  .merge-opt label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
  .merge-opt input { accent-color: var(--brand); margin-top: 3px; }
  .merge-opt[hidden] { display: none; }
  .drop small { color: var(--ink-3); }
  textarea.plan { min-height: 260px; font-family: inherit; }
  details.fmt { margin-top: 10px; }
  details.fmt summary { cursor: pointer; font-weight: 700; color: var(--brand); }
  details.fmt pre { background: var(--bg); border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; font-family: inherit; font-size: 13px; line-height: 1.8; margin: 8px 0 0; }
  .pv-sum { font-weight: 800; margin-bottom: 8px; }
  .pv-g { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
  .pv-gh { padding: 8px 12px; background: var(--bg); font-weight: 800; }
  .pv-gh small { display: block; color: var(--gold); font-size: 12px; }
  .pv-s { padding: 9px 12px; border-top: 1px solid var(--line); display: grid; gap: 5px; }
  .pv-s > b { font-size: 13.5px; }
  .pv-f { display: flex; flex-wrap: wrap; gap: 4px; }
  .pv-note { font-size: 12px; color: var(--ink-2); }

  /* الجداول */
  .tbl-wrap { overflow-x: auto; }
  table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.tbl th, table.tbl td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.tbl th { font-size: 12px; color: var(--ink-3); font-weight: 800; background: var(--bg); position: sticky; top: 0; }
  table.tbl td small { color: var(--ink-3); display: block; }
  .wk { padding: 0; overflow: hidden; }
  .wk-h { padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--line); font-weight: 800; display: flex; gap: 8px; align-items: center; }
  .wk-h .chip { margin-inline-start: 4px; }
  .wk-d { display: grid; grid-template-columns: 150px 1fr; gap: 10px; padding: 9px 16px; border-bottom: 1px solid var(--line); }
  .wk-d:last-child { border-bottom: 0; }
  .wk-d.today { background: var(--brand-soft); }
  .wk-d > b { font-size: 13px; }
  .wk-items { display: grid; gap: 4px; }
  .wk-it { font-size: 13px; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
  .wk-it small { color: var(--ink-3); }

  /* الإعدادات والمساعدة */
  .set-row { display: grid; grid-template-columns: 230px 1fr; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
  .set-row:first-of-type { border-top: 0; }
  .set-row > b { font-size: 13.5px; }
  .set-row > b small { display: block; color: var(--ink-3); font-weight: 500; font-size: 12px; margin-top: 2px; }
  .set-stack { display: grid; gap: 9px; }
  .help { line-height: 1.9; }
  .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .step { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--bg); }
  .step .n { margin-bottom: 8px; width: 28px; height: 28px; font-size: 14px; }
  .step b { display: block; margin-bottom: 2px; }
  .step p { margin: 0; color: var(--ink-2); font-size: 13.5px; }
  .tips { display: grid; gap: 8px; padding: 0; margin: 0; list-style: none; }
  .tips li { padding: 10px 12px; border-radius: 10px; background: var(--bg); border-inline-start: 3px solid var(--gold); }
  .faq details { border-top: 1px solid var(--line); padding: 10px 0; }
  .faq summary { cursor: pointer; font-weight: 800; }
  .faq p { margin: 6px 0 0; color: var(--ink-2); }

  /* القوالب الملتقطة */
  .tfield { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
  .tfield.off .tfv { opacity: .45; }
  .tfl { font-weight: 700; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
  .tlist-o { display: grid; gap: 6px; }
  .tit { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 11px; background: var(--card); text-decoration: none; color: inherit; }
  .tit:hover { border-color: var(--brand); }
  .tit small { color: var(--ink-3); }

  @media (max-width: 880px) {
    .wrap { grid-template-columns: 1fr; padding: 12px 14px 60px; }
    .side { position: static; display: flex; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
    .side a { white-space: nowrap; }
    .side .sep { display: none; }
    .ph { grid-template-columns: 1fr; }
    .ph-meta, .grid3 { grid-template-columns: 1fr 1fr; }
    .ph-meta label:last-child { grid-column: 1 / -1; }
    .set-row, .fv, .wk-d { grid-template-columns: 1fr; gap: 6px; }
    .top { flex-wrap: wrap; padding: 10px 14px; }
    .gsearch { width: 100%; }
  }
</style>
</head>
<body>
<header class="top">
  <img src="icons/icon128.png" alt="">
  <div><h1>حاضر</h1><p>مكتبة التحاضير لمنصة نور</p></div>
  <div class="gsearch"><span id="gsIc"></span><input id="gq" placeholder="ابحث في كل الدروس والحصص…" autocomplete="off"></div>
</header>
<div class="wrap">
  <nav class="side" id="nav">
    <a href="#library" data-r="library"><span data-ic="book"></span>المكتبة<span class="cnt" id="cntLib"></span></a>
    <a href="#create" data-r="create"><span data-ic="plus"></span>إضافة تحضير</a>
    <a href="#schedule" data-r="schedule"><span data-ic="calendar"></span>جدول النشر</a>
    <a href="#log" data-r="log"><span data-ic="list"></span>السجل</a>
    <a href="#transfer" data-r="transfer"><span data-ic="swap"></span>استيراد وتصدير</a>
    <a href="#settings" data-r="settings"><span data-ic="sliders"></span>الإعدادات</a>
    <a href="#help" data-r="help"><span data-ic="help"></span>طريقة الاستخدام</a>
    <div class="sep"></div>
    <a href="#templates" data-r="templates" class="minor"><span data-ic="layers"></span>القوالب الملتقطة</a>
  </nav>
  <main class="view" id="view"></main>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" hidden>
<script type="module" src="options.js"></script>
</body>
</html>
