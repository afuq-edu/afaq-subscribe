<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>حاضر — تحضير فصل كامل</title>
<style>
  :root{--teal:#0f766e;--teal-d:#0b5d57;--ink:#16302b;--muted:#4a5e59;--bg:#f4f1ea;--card:#fffdf8;--line:rgba(22,48,43,.12);--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--info:#0f766e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:500 13.5px/1.7 Tajawal,'Segoe UI',Tahoma,sans-serif;direction:rtl}
  header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--teal);color:#fff}
  header b{font-size:16px}
  header small{opacity:.8;margin-inline-start:auto}
  main{padding:12px 14px 40px;display:grid;gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
  .card h3{margin:0;font-size:14px;color:var(--teal)}
  .f{display:grid;gap:4px}
  .f span{font-size:12px;color:var(--muted)}
  .input,select{all:unset;box-sizing:border-box;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;font:inherit;width:100%}
  select{appearance:auto;-webkit-appearance:menulist}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
  .row>.f{flex:1 1 180px}
  .radios{display:flex;gap:6px}
  .radios label{flex:1;text-align:center;border:1.5px solid var(--line);border-radius:10px;padding:7px;cursor:pointer;background:#fff;font-weight:700}
  .radios input{display:none}
  .radios input:checked+span{color:var(--teal)}
  .radios label:has(input:checked){border-color:var(--teal);background:#dff1ee}
  .days{display:flex;gap:4px;flex-wrap:wrap}
  .day{all:unset;cursor:pointer;border:1.5px solid var(--line);border-radius:9px;padding:4px 9px;font-size:12px;background:#fff}
  .day.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  .opts{display:grid;gap:4px;font-size:13px}
  .opts label{display:flex;gap:8px;align-items:center;cursor:pointer}
  .btn{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;border-radius:11px;padding:9px 14px;font-weight:800;border:1.5px solid var(--teal);color:var(--teal);background:#fff}
  .btn.primary{background:var(--teal);color:#fff}
  .btn.primary:hover{background:var(--teal-d)}
  .btn.danger{border-color:var(--bad);color:var(--bad)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.sm{padding:6px 10px;font-size:12.5px}
  .acts{display:flex;gap:8px;flex-wrap:wrap}
  .msg{display:none;border-radius:10px;padding:8px 12px;font-weight:700}
  .msg.show{display:block}
  .msg.ok{background:#e3f4e8;color:var(--ok)}.msg.warn{background:#fcefdc;color:var(--warn)}.msg.bad{background:#fde4e4;color:var(--bad)}.msg.info{background:#dff1ee;color:var(--info)}
  .prog{height:7px;background:rgba(22,48,43,.08);border-radius:99px;overflow:hidden}
  .prog i{display:block;height:100%;width:0;background:var(--teal);transition:width .3s}
  .steps{display:flex;gap:6px;flex-wrap:wrap}
  .step{font-size:12px;border-radius:9px;padding:3px 9px;background:#fff;border:1.5px solid var(--line);color:var(--muted)}
  .step.on{border-color:var(--teal);color:var(--teal);font-weight:800}
  .step.done{background:#e3f4e8;border-color:#e3f4e8;color:var(--ok)}
  .now{border-radius:12px;padding:10px 12px;border:2px solid var(--line);display:grid;gap:6px}
  .now.run{border-color:var(--teal)}.now.warn{border-color:var(--warn)}.now.bad{border-color:var(--bad)}.now.ok{border-color:var(--ok)}
  .now b{font-size:14px}
  .now p{margin:0;white-space:pre-line}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid var(--teal);border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle;margin-inline-end:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .lesson{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  .lh{display:flex;gap:8px;align-items:center;padding:8px 10px;background:#f7f5ef}
  .lh .u{font-size:11.5px;color:var(--muted)}
  .lh b{font-size:13.5px}
  .lh .c{margin-inline-start:auto;font-size:12px;color:var(--muted);white-space:nowrap}
  .lh.miss{background:#fcefdc}.lh.miss .c{color:var(--warn)}
  .ses{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:6px 10px;border-top:1px dashed var(--line);font-size:12.5px}
  .ses.cur{background:#dff1ee}
  .ses small{display:block;color:var(--muted);font-size:11.5px}
  .st{font-size:11.5px;font-weight:700;white-space:nowrap}
  .st.ok{color:var(--ok)}.st.run{color:var(--teal)}.st.wait{color:var(--warn)}.st.bad{color:var(--bad)}.st.skip{color:var(--muted)}
  .log{display:grid;gap:3px;font-size:12.5px;max-height:220px;overflow:auto}
  .log div{padding:3px 6px;border-radius:7px}
  .log .ok{color:var(--ok)}.log .bad{color:var(--bad);background:#fde4e4}.log .skip{color:var(--muted)}.log .info{color:var(--info)}
  .empty{color:var(--muted);text-align:center;padding:10px}
  .map{all:unset;box-sizing:border-box;appearance:auto;-webkit-appearance:menulist;margin-top:4px;max-width:100%;width:100%;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:3px 6px;font:500 12px Tajawal,'Segoe UI',Tahoma,sans-serif;direction:ltr;text-align:left}
  .map.warn{border-color:var(--warn);background:#fcefdc}.map.bad{border-color:var(--bad);background:#fde4e4}
  .seq{all:unset;cursor:pointer;font-size:11.5px;color:var(--teal);font-weight:700;margin-inline-start:6px;white-space:nowrap}
  .seq:hover{text-decoration:underline}
  .flag{font-size:11.5px;font-weight:800}.flag.warn{color:var(--warn)}.flag.bad{color:var(--bad)}.flag.ok{color:var(--ok)}
  .lh>div:first-child{flex:1;min-width:0}
  .hint{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header><b>حاضر — تحضير فصل كامل</b><small id="ver"></small></header>
<main>
  <div class="msg" id="topMsg"></div>

  <section class="card" id="setupCard">
    <h3>الإعداد</h3>
    <div class="row">
      <label class="f"><span>المادة (من مكتبتك)</span><select id="pkgSel"></select></label>
      <div class="f"><span>الفصل الدراسي</span>
        <div class="radios">
          <label><input type="radio" name="term" value="1" checked><span>الأول</span></label>
          <label><input type="radio" name="term" value="2"><span>الثاني</span></label>
        </div>
      </div>
    </div>
    <div class="row">
      <label class="f"><span>أول تاريخ نشر</span><input class="input" type="date" id="start"></label>
      <div class="f"><span>أيام الحصص <em class="hint" id="startDay"></em></span><div class="days" id="days"></div></div>
    </div>
    <div class="opts">
      <label><input type="checkbox" id="optReview"> راجع الخطة قبل بدء التعبئة (وإلا تبدأ فور قراءة دروس الفصل)</label>
      <label><input type="checkbox" id="optStep"> توقّف قبل كل حفظ لأراجع النموذج بنفسي</label>
      <label><input type="checkbox" id="optNoor" checked> أكمل الناقص فقط: اقرأ قائمة «التحاضير» في نور ولا تكرر حصة موجودة فيها</label>
    </div>
    <div class="acts">
      <button class="btn primary" id="startBtn">▶ ابدأ من الصفحة الرئيسية</button>
      <button class="btn danger" id="stopBtn" hidden>■ إيقاف</button>
      <button class="btn" id="goBtn" hidden>✓ الخطة مناسبة — ابدأ التعبئة</button>
    </div>
    <div class="hint">المسار: الرئيسية ← بطاقة المادة ← «تحضير الدروس» ← «إضافة تحضير» ← دروس الفصل المختار من الشجرة ← تعبئة كل حصة وحفظها بتاريخ نشر متتالٍ. الفصل الآخر لا يُلمس.</div>
  </section>

  <section class="card" id="nowCard" hidden>
    <div class="steps" id="steps"></div>
    <div class="prog"><i id="prog"></i></div>
    <div class="now" id="nowBox"><b id="nowHead"></b><p id="nowText"></p><div class="acts" id="nowActs" hidden></div></div>
  </section>

  <section class="card" id="planCard" hidden>
    <h3>الخطة <span class="hint" id="planSum"></span></h3>
    <div id="plan"></div>
  </section>

  <section class="card" id="logCard" hidden>
    <div class="acts" style="align-items:center"><h3 style="margin-inline-end:auto">السجل</h3><button class="btn sm" id="reportBtn">نسخ تقرير التشغيل</button></div>
    <div class="log" id="log"></div>
  </section>
</main>
<script type="module" src="semester.js"></script>
</body>
</html>
